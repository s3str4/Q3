<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arena Duel</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%23ffb347'/%3E%3Ccircle cx='8' cy='8' r='3' fill='%23111'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/client/style.css">
<script type="importmap">
{ "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/" } }
</script>
</head>
<body>
<canvas id="gl"></canvas>
<div id="hud" class="hidden">
  <div id="damage-flash"></div>
  <div id="pickup-flash"></div>
  <div id="dmg-dirs"><div class="dmg-dir"></div><div class="dmg-dir"></div><div class="dmg-dir"></div><div class="dmg-dir"></div></div>
  <div id="crosshair"><div class="ch-dot"></div></div>
  <div id="hitmarker"></div>
  <div id="hud-top">
    <div id="scores">
      <div class="scorebox me"><span id="score-me" class="score">0</span><span id="name-me" class="pname"></span></div>
      <div id="timer">10:00</div>
      <div class="scorebox them"><span id="score-them" class="score">0</span><span id="name-them" class="pname"></span></div>
    </div>
  </div>
  <div id="obituary"></div>
  <div id="item-timers"></div>
  <div id="pickup-msg"></div>
  <div id="center-msg"></div>
  <div id="speedometer">0</div>
  <div id="hud-bottom">
    <div class="stat ammo"><svg class="icon" viewBox="0 0 32 32"><path id="ammo-icon" d="M12 4h8v6l2 2v16H10V12l2-2z" fill="currentColor"/></svg><div class="col"><span id="ammo" class="value">100</span><span id="wname" class="label">MACHINEGUN</span></div></div>
    <div class="stat health"><svg class="icon" viewBox="0 0 32 32"><path d="M12 3h8v9h9v8h-9v9h-8v-9H3v-8h9z" fill="currentColor"/></svg><div class="col"><span id="hp" class="value">125</span><span class="label">HEALTH</span></div></div>
    <div class="stat armor"><svg class="icon" viewBox="0 0 32 32"><path d="M16 2l12 4v10c0 8-5 13-12 16C9 29 4 24 4 16V6z" fill="currentColor"/></svg><div class="col"><span id="ar" class="value">0</span><span class="label">ARMOR</span></div></div>
  </div>
  <div id="weapons"></div>
  <div id="netgraph"><canvas id="ng-canvas" width="180" height="44"></canvas><div id="ng-text"><span id="ng-fps">0 fps</span><span id="ng-frame"></span><span id="ng-ping">0 ms</span><span id="ng-snap"></span></div></div>
</div>
<div id="scoreboard" class="hidden"></div>
<div id="menu">
  <div class="panel">
    <h1>ARENA DUEL</h1>
    <p class="sub">Quake III style 1v1 · 60 Hz authoritative netcode · lag-compensated hitscan</p>
    <label>Name <input id="name" maxlength="24" value=""></label>
    <label>Server <input id="server" value=""></label>
    <div class="row">
      <button id="btn-connect" class="primary">CONNECT</button>
      <button id="btn-practice">PRACTICE VS BOT</button>
    </div>
    <details><summary>Direct P2P (no server, invite code)</summary>
      <div class="row"><button id="btn-host">HOST GAME</button><button id="btn-join">JOIN WITH CODE</button></div>
      <textarea id="p2p-code" placeholder="invite / answer code" rows="3"></textarea>
      <div id="p2p-status"></div>
    </details>
    <details><summary>Settings</summary>
      <label>Sensitivity <input id="sens" type="range" min="1" max="20" step="0.5" value="5"><span id="sens-v">5</span></label>
      <label>FOV <input id="fov" type="range" min="80" max="130" step="1" value="100"><span id="fov-v">100</span></label>
      <label>Master volume <input id="vol" type="range" min="0" max="1" step="0.05" value="0.8"></label>
      <label><input id="opt-cshair" type="checkbox"> Large crosshair</label>
      <label><input id="opt-interp" type="range" min="1" max="4" step="1" value="2"> Interpolation (snapshots)</label>
    </details>
    <p class="help">WASD move · Space jump · Ctrl crouch · Mouse fire · 1-7 / wheel weapons · Tab scoreboard · Esc menu</p>
    <div id="menu-status"></div>
  </div>
</div>
<script type="module" src="/client/main.js"></script>
</body>
</html>
